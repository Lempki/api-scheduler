# The form behind "New issue > Idea", which files a feature or expansion for the roadmap.
# The Roadmap project on the owner's GitHub profile collects these issues from every repository.

name: Idea
description: Suggest a feature, an expansion, or an improvement for the roadmap.
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What should change, and for whom?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What problem does it solve, or what does it make possible?
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Steps, sketches, related issues, or open questions. Leave it empty if there are none.
