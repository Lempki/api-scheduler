extend = ".ruff-base.toml"

[lint]
# Docstring and annotation rules are switched on once the existing code meets them.
extend-ignore = ["D", "ANN"]

[lint.isort]
known-first-party = ["scheduler_api"]

[lint.flake8-bugbear]
# FastAPI declares dependencies and parameters as call defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Security"]
